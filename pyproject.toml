[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "madrid"
dynamic = ["version"]
description = "iMessage rich-text send/receive bridge for agents (MCP + CLI + watch); stdlib-only Python."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "madrid contributors" }]
keywords = ["imessage", "mcp", "agents", "rich-text"]
dependencies = []          # stdlib only — deliberate

urls = { Homepage = "https://github.com/XXY-CH/madrid", Issues = "https://github.com/XXY-CH/madrid/issues" }

[project.scripts]
madrid = "madrid.cli:main"

[tool.setuptools.dynamic]
version = { attr = "madrid.__version__" }

[tool.setuptools]
packages = ["madrid"]

[tool.setuptools.package-data]
madrid = ["native/*.m"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
